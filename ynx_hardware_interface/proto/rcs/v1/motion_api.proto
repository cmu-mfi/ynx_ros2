message StartIncrementMoveRequest {
    uint32 control_group_bit = 1; // Specify the control group you want to move by bit. For example, if you want to move group 0 and group 1, please set 0b00000011.
    optional int32 task_no = 2; // Set `task_no` if you want. If `task_no` is not set, it is determined automatically
}

message StartIncrementMoveResponse {
    Timestamp timestamp = 1;

    // The `task_no` is allocated task number in the controller.
    // The control groups which has different task number can move asynchronously.
    // This `task_no` will be released when the StopIncrementMove() is called, servo power is disabled and something else.
    int32 task_no = 2;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_GROUP_DOES_NOT_EXIST = 3; // Specified control group does not exist.
        STATUS_TASK_NO_OVER = 4; // The limit of motion parallelization is over.
        STATUS_COMBO_GROUP_LACK = 5; // If you want to move a robot and it has base, the base group is also specified with the robot group and vice versa.
        STATUS_GROUP_NO_OVER = 6; // Specified number of control groups is over.
        STATUS_GROUP_USED = 7; // Specified group has been controlled already by other services or something else.
        STATUS_GROUP_UNMATCHED = 8; // Specified group has been already started.
        STATUS_READY_TIMEOUT = 9; // Failed to change state to ready for increment move in a certain time.
    }
    Status status = 3;
}

message StopIncrementMoveRequest {
    // The `task_no` will be provided by `StartIncrementMove()`.
    int32 task_no = 1;
}

message StopIncrementMoveResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_TASK_NO_OVER = 3; // The task number is over the limit.
    }
    Status status = 2;
}

message IncrementMoveGroupRequest {
    uint32 group_no = 1;

    uint32 tool_no = 2;

    // Incremental value amount for each axis.
    oneof pos {
        PulsePos pulse = 3; // Axes position in pulse.
        AxesPos angle = 4; // Axes position in angle.
        CartesianPos base = 5; // `BASE` frame position.
        CartesianPos robot = 6; // `ROBOT` frame position.
        CartesianPos user = 7; // `USER` frame position.
    }

    optional uint32 frame_aux_no = 10; // Required if you use `user` as the `pos`.

    message IncrementMoveSync {
        enum SyncControl {
            SYNC_CONTROL_UNSPECIFIED = 0;
            SYNC_CONTROL_DISABLE = 1;
            SYNC_CONTROL_ENABLE = 2;
        }
        SyncControl control = 1;
        uint32 master_no = 2;
    };
    optional IncrementMoveSync sync = 11;
}

message SetIncrementMoveRequest {
    int32 task_no = 1;

    int32 timeout = 2;

    repeated IncrementMoveGroupRequest requests = 3;
}

message SetIncrementMoveResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NUMBER_OF_REQUESTS_OVER = 3; // The number of requests is over than configured groups in robot controller.
        STATUS_GROUP_DOES_NOT_EXIST = 4; // Specified control group does not exist in the controller.
        STATUS_GROUP_NO_DUPLICATE = 5; // The `group_no` in the requests are duplicate.
        STATUS_POS_TYPE_ILLEGAL = 6; // Specified unknown `pos`.
        STATUS_TASK_NO_OVER = 7; // The task number is over the limit.
        STATUS_GROUP_DOES_NOT_READY = 8; // The group have not started by `StartIncrementMove()`.
        STATUS_MASTER_GROUP_DOES_NOT_EXIST = 9; // Specified master group number does not exist in the controller.
        STATUS_MASTER_GROUP_NOT_READY = 10; // Specified master group have not started `StartIncrementMove()`.
        STATUS_MASTER_GROUP_TYPE_NOT_SUPPORTED = 11; // Specified master group type is not supported to be master group.
        STATUS_SLAVE_GROUP_TYPE_NOT_SUPPORTED = 12; // Specified slave group type is not supported to be slave group.
        STATUS_MASTER_GROUP_SPECIFY_ERROR = 13; // Specified master group was itself. For example, the base group specified its robot group as the master group.
        STATUS_MULTIPLE_MASTER_GROUP = 14; // Multiple groups were specified as master group.
        STATUS_MASTER_OR_SLAVE_GROUP_LACK = 15; // Master group or slave group lacked.
        STATUS_SERVO_POWER_NOT_ENABLED = 16; // The servo power is not enabled.
        STATUS_ENERGY_SAVING_RECOVERY_ERROR = 17; // Failed to recovery from energy saving mode.
        STATUS_GROUP_USED = 18; // Specified group has been controlled already by other services or something else.
        STATUS_TOOL_NO_OUTRANGE = 19; // The tool number is out of range or illegal.
        STATUS_POS_TYPE_UNSUPPORTED = 20; // The position type is not supported for increment move.
        STATUS_FRAME_AUX_NO_MISSING = 21; // The frame aux no (ex. user frame number) is not specified.
        STATUS_FRAME_AUX_NO_OUTRANGE = 22; // The frame aux no (ex. user frame number) is out of range or illegal.
        STATUS_TIMEOUT = 23; // Execution could not be completed during the specified in `timeout`.
        STATUS_CALLED_BEFORE_READY = 24; // Called before execution of `StartIncrementMove()` is completed.
    }
    Status status = 2;
}

message StartIncrementMoveBufferRequest {
    uint32 control_group_bit = 1; // Specify the control group you want to move by bit. For example, if you want to move group 0 and group 1, please set 0b00000011.
    optional int32 task_no = 2; // Set `task_no` if you want. If `task_no` is not set, it is determined automatically
    int32 trigger = 3; // if trigger is greater than 0, the increment move is not started until the number of queued increment value is greater than `trigger`.
}

message StartIncrementMoveBufferResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_GROUP_DOES_NOT_EXIST = 3; // Specified control group does not exist.
        STATUS_TASK_NO_OVER = 4; // The limit of motion parallelization is over.
        STATUS_COMBO_GROUP_LACK = 5; // If you want to move a robot and it has base, the base group is also specified with the robot group and vice versa.
        STATUS_GROUP_NO_OVER = 6; // Specified number of control groups is over.
        STATUS_GROUP_USED = 7; // Specified group has been controlled already by other services or something else.
        STATUS_GROUP_UNMATCHED = 8; // Specified group has been already started.
        STATUS_READY_TIMEOUT = 9; // Failed to change state to ready for increment move in a certain time.
    }
    Status status = 2;

    // The `task_no` is allocated task number in the controller.
    // The control groups which has different task number can move asynchronously.
    // This `task_no` will be released when the StopIncrementMoveBuffer() is called, servo power is disabled and something else.
    int32 task_no = 3;
}

message StopIncrementMoveBufferRequest {
    // The `task_no` will be provided by `StartIncrementMoveBuffer()`.
    int32 task_no = 1;
}

message StopIncrementMoveBufferResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_TASK_NO_OVER = 3; // The task number is over the limit.
    }
    Status status = 2;
}

message SendIncrementMoveBufferRequest {
    int32 task_no = 1; // The task number assigned by `StartIncrementMoveBuffer()`.
    int32 timeout = 2; // Timeout duration. If set to -1, the request will wait indefinitely.
    int32 group_num = 3; // The number of control groups included in this request.
    int32 position_num = 4; // The number of positions (increments) specified for each group.
    optional bool is_eop = 5; // Indicates whether this request marks the end of the path.
    repeated IncrementMoveGroupRequest requests = 6; // A flattened list of increment values for all groups.
                                                     // When specifying multiple increment values for multiple control groups,
                                                     // the data should be flattened from a 2D structure into a 1D array.
                                                     // For example, if you want to send increments [3, 4, 5] to group 0 and [6, 7, 8] to group 1,
                                                     // the flattened array would be [3, 6, 4, 7, 5, 8].
}

message SendIncrementMoveBufferResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_GROUP_DOES_NOT_EXIST = 3; // Specified control group does not exist.
        STATUS_GROUP_NO_DUPLICATE = 4; // The `group_no` in the requests are duplicate.
        STATUS_GROUP_NO_INCONSISTENT = 5; // The same group number is specified twice or more in one position.
        STATUS_TASK_NO_OVER = 6; // The limit of motion parallelization is over.
        STATUS_GROUP_DOES_NOT_READY = 7; // The group have not started by `StartIncrementMoveBufferBuffer()`.
        STATUS_MASTER_GROUP_DOES_NOT_EXIST = 8; // Specified master group number does not exist in the controller.
        STATUS_MASTER_GROUP_NOT_READY = 9; // Specified master group have not started by `StartIncrementMoveBuffer()`.
        STATUS_MASTER_GROUP_TYPE_NOT_SUPPORTED = 10; // Specified master group type is not supported to be master group.
        STATUS_SLAVE_GROUP_TYPE_NOT_SUPPORTED = 11; // Specified slave group type is not supported to be slave group.
        STATUS_MASTER_GROUP_SPECIFY_ERROR = 12; // Specified master group was itself. For example, the base group specified its robot group as the master group.
        STATUS_MULTIPLE_MASTER_GROUP = 13; // Multiple groups were specified as master group.
        STATUS_MASTER_OR_SLAVE_GROUP_LACK = 14; // Master group or slave group lacked.
        STATUS_TOOL_NO_OUTRANGE = 15; // The tool number is out of range or illegal.
        STATUS_POS_TYPE_OUTRANGE = 16; // The position type is not supported for increment move.
        STATUS_POS_TYPE_UNSUPPORTED = 17; // The position type is not supported for increment move.
        STATUS_FRAME_AUX_NO_OUTRANGE = 18; // The frame aux no (ex. user frame number) is out of range or illegal.
        STATUS_TIMEOUT = 19; // Execution could not be completed during the specified in `timeout`.
        STATUS_CALLED_BEFORE_READY = 20; // Called before execution of `StartIncrementMoveBuffer()` is completed.
        STATUS_BUFFER_NO_SPACE_AVAILABLE = 21; // Not enough available space in the buffer.
        STATUS_RUN_FAILED = 22; // Increment move is failed in start.
        STATUS_NUMBER_OF_GROUP_OUTRANGE = 23; // Specified the number of groups is out of range.
        STATUS_NUMBER_OF_POSITIONS_OUTRANGE = 24; // Specified the number of groups is out of range.
        STATUS_NUMBER_OF_REQUESTS_UNMATCHED = 25; // The number of requests is less than the number of groups * the number of positions.
        STATUS_SYNC_CTRL_ILLEGAL = 26; // Specified synchrnous control is invalid.
        STATUS_FRAME_AUX_NO_MISSING = 27; // The frame aux no (ex. user frame number) is not specified.
        STATUS_POS_TYPE_ILLEGAL = 28; // Specified position type is invalid.
    }

    Status status = 2;
    repeated uint32 id = 3; // Increment move value ID.
    uint32 count = 4; // Available count in the buffer.
}
