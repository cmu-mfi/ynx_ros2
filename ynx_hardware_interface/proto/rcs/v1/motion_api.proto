syntax = "proto3";

package rcs.v1;

import "rcs/v1/timestamp.proto";
import "rcs/v1/position_types.proto";

/**
 * `ServoPowerControl` service provides a way to control a servo power enable or disable.
 *
 * [ERRORS]
 * - See the status defined in each response message.
 */
service ServoPowerControlService {
    // Enable servo power of the robots connected the controller.
    // Return the error if the condition for servo on is not satisfied.
    rpc PowerOnServos(PowerOnServosRequest) returns (PowerOnServosResponse);
    // Disable servo power of the robots connected the controller.
    rpc PowerOffServos(PowerOffServosRequest) returns (PowerOffServosResponse);
}

/**
 * `TargetControl` service provides a way to send `Target` in runtime
 * and get the status of the `Target`. This service also control `Target` for multiple robots.
 * The server have a queue of target. If target queue is full, return the call immediately as error.
 * A robot does not start moving by sending targets by this service. Please call `StartMotion()` in `Motion Control` service then the robot will start moving towards the targets.
 *
 * [ERRORS]
 * - See the status defined in each response message.
 */
service TargetControlService {
    // Sends a target position and motion attributes for joint motion. Returns the `target id` to trace the motion.
    rpc SendJointMotionTarget(SendJointMotionTargetRequest) returns (SendJointMotionTargetResponse);
    // Sends a target position and motion attributes for linear motion. Returns the `target id` to trace the motion.
    rpc SendLinearMotionTarget(SendLinearMotionTargetRequest) returns (SendLinearMotionTargetResponse);
    // Sends multiple target positions and motions attributes for joint and linear motion. Returns the `target id` to trace the motion.
    rpc SendMultipleMotionTargets(SendMultipleMotionTargetsRequest) returns (SendMultipleMotionTargetsResponse);
    // Clear the `Target`s in the queue. If `Target`s are cleared in running, the motion will stop immediately.
    rpc ClearTarget(ClearTargetRequest) returns (ClearTargetResponse);
    // Get the status of `Target` by `target id`. The status includes running status and progress of the `Target`.
    rpc ReceiveTarget(ReceiveTargetRequest) returns (ReceiveTargetResponse);
}

/**
 * `MotionControl` service provide a way to control motion.
 * To move the robot, you must send a `Target` using `TargetControl` service in advance
 * or send a `Target` after `StartMotion()`.
 * You can also stop the robot motion in running via this service.
 *
 * [ERRORS]
 * - See the status defined in each response message.
 */
service MotionControlService {
    // Allow to start motion as fetching `Targets` queued. Robot continue motion unless the queue becomes empty.
    // Sending new `Target` after robot stopped due to the queue became empty, robot will start motion again without calling `StartMotion()`.
    rpc StartMotion(StartMotionRequest) returns (StartMotionResponse);
    // Stop motion and to execute `Target`s.
    rpc StopMotion(StopMotionRequest) returns (StopMotionResponse);
    // Stop motion and the servo power supply is turned OFF. `Target` queue is not cleared.
    rpc AbortMotion(AbortMotionRequest) returns (AbortMotionResponse);
}

/**
 * `IncrementMove` service provides a way to control the robot by putting amount of movement in every interpolation cycle.
 * This service is useful if you want to move robot in free curved path.
 *
 * You can call `StartIncrementMove()` with target group then return a handle.
 * If the target group is already controlled by other service, an error will be returned.
 *
 * The handle will be invalid automatically when below events are happened.
 *
 * - The servo power turned off.
 * - The operation mode TEACH/PLAY is changed.
 * - Alarms occur.
 * - Any other event that causes the robots to stop.
 *
 * User program needs to get a new handle `StartIncrementMove()` to restart again,
 * then call `SetIncrementMove()` with the new handle. It is not necessary to call
 * `StopIncrementMove()` to disable previous handle.
 *
 * [ERRORS]
 * - See the status defined in each response message.
 */
service IncrementMoveService {
    // The robot can be operated by sending incremental values in interpolation cycles.
    rpc StartIncrementMove(StartIncrementMoveRequest) returns (StartIncrementMoveResponse);
    // Stop incremental movement of the robot.
    rpc StopIncrementMove(StopIncrementMoveRequest) returns (StopIncrementMoveResponse);
    // Set the incremental movement amount for each interpolation cycle for groups.
    rpc SetIncrementMove(SetIncrementMoveRequest) returns (SetIncrementMoveResponse);
}

service IncrementMoveBufferService {
    // The robot can be operated by sending incremental values in interpolation cycles.
    rpc StartIncrementMoveBuffer(StartIncrementMoveBufferRequest) returns (StartIncrementMoveBufferResponse);
    // Stop incremental movement of the robot.
    rpc StopIncrementMoveBuffer(StopIncrementMoveBufferRequest) returns (StopIncrementMoveBufferResponse);
    // Set the incremental movement amount for each interpolation cycle for groups.
    rpc SendIncrementMoveBuffer(SendIncrementMoveBufferRequest) returns (SendIncrementMoveBufferResponse);
}

