enum ReferenceType {
    REFERENCE_TYPE_UNSPECIFIED = 0;

    // The target position bases on the origin.
    // For example, when the each axis target position of the target is 10[deg], the manipulator moves to the position of 10[deg].
    REFERENCE_TYPE_ABSOLUTE = 1;

    // The target position bases on the start position.
    // For example, when the each axis target position of the target is 10[deg] and each axis angle is 5[deg], the manipulator moves to the position of 15[deg].
    REFERENCE_TYPE_RELATIVE = 2;
}

enum BlendingControl {
    BLENDING_CONTROL_UNSPECIFIED = 0;
    BLENDING_CONTROL_DEFAULT = 1;
    BLENDING_CONTROL_PL = 2;
    BLENDING_CONTROL_FPL = 3; // Future feature to be supported.
    BLENDING_CONTROL_PD = 4;  // Future feature to be supported.
}

message PowerOnServosRequest {
    // empty
}

message PowerOnServosResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
    }
    Status status = 2;
}

message PowerOffServosRequest {
    // empty
}

message PowerOffServosResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
    }
    Status status = 2;
}

message TargetPos {
    oneof pos {
        PulsePos pulse = 1; // `PULSE` frame target.
        AxesPos angle = 2; // `ANGLE` frame target.
        CartesianPos base = 3; // `BASE` frame target.
        CartesianPos robot = 4; // `ROBOT` frame target.
        CartesianPos user = 5; // `USER` frame target.
    }

    // This member is required if you use `user` as the `position`.
    optional int32 frame_aux_no = 11;
}

message CircularTargetPos {
    oneof dst {
        PulsePos pulse = 1; // `PULSE` frame target.
        AxesPos angle = 2; // `ANGLE` frame target.
        CartesianPos base = 3; // `BASE` frame target.
        CartesianPos robot = 4; // `ROBOT` frame target.
        CartesianPos user = 5; // `USER` frame target.
    }

    oneof ref {
        PulsePos ref_pulse = 6; // `PULSE` frame target.
        AxesPos ref_angle = 7; // `ANGLE` frame target.
        CartesianPos ref_base = 8; // `BASE` frame target.
        CartesianPos ref_robot = 9; // `ROBOT` frame target.
        CartesianPos ref_user = 10; // `USER` frame target.
    }

    // This member is required if you use `user` as the `position`.
    optional int32 frame_aux_no = 11;
}

message TaskAttr {
    int32 number = 1;
}

message ToolAttr {
    int32 number = 1;
}

message JointSpeedAttr {
    double vj = 1; // [%]
}

// The slower setting is applied for the motion.
message LinearSpeedAttr {
    oneof speed {
        double v = 1; // [mm/sec]
        double vr = 2; // [degree/sec]
    }
}

message AccAttr {
    double ratio = 1; // [%]
}

message DecAttr {
    double ratio = 1; // [%]
}

message BlendingAttr {
    BlendingControl control = 1;
    double value = 2; // [mm]
}

message SynchronizationAttr {
    int32 parent_group_no = 1;
}

message RelativeAttr {
    // The `enable_relative` controls the target position is relative or absolute.
    // True: The target is handled as relative position
    // False: The target is handled as absolute position.
    // The relative means the target position bases on the start position.
    // For example, when the each axis position of the target is 10[deg] and the current angle of each axis is 5[deg], the manipulator moves to 15[deg].
    // The absolute means the target position bases on the origin.
    // For example, when the each axis position of the target is 10[deg], the manipulator moves to 10[deg] wherever robot starts at.
    bool enable_relative = 1;
}

message SendTargetResult {
    int32 target_id = 1;
}

message SendJointMotionTargetRequest {
    int32 group_no = 1; // The index of control groups for the motion.
    TargetPos target = 2;
    JointSpeedAttr speed = 3;

    optional int32 timeout = 9; // The timeout until received by the robot controller. The default is infinite(0xFFFFFFFF). The valid range is 0 ~ 268435455 millliseconds. The negative value is also handled as infinite.
    optional TaskAttr task = 10; // If not specified, the task number is automatically assigned to be able to run as much as possible in parallel.
    optional ToolAttr tool = 11; // The default tool number is `0`.
    optional AccAttr acc = 12; // The acceleration of the motion. The default is `100` %. The min is `20` % and the max is `100` %.
    optional DecAttr dec = 13; // The deceleration of the motion. The default is `100` %. The min is `20` % and the max is `100` %.
    optional BlendingAttr blending = 14; // The default control is `BLENDING_DEFAULT` and the distance is as much as possible.
    optional RelativeAttr relative = 15; // // If not specified, the target position is used as ABSOLUTE position.
    optional SynchronizationAttr synchronization = 16;
}

message SendJointMotionTargetResponse {
    Timestamp timestamp = 1;

    SendTargetResult result = 2;

    SendTargetResponseStatus status = 3;
}

message SendLinearMotionTargetRequest {
    int32 group_no = 1; // The index of control groups for the motion.
    TargetPos target = 2;
    LinearSpeedAttr speed = 3;

    optional int32 timeout = 9; // The timeout until received by the robot controller. The default is infinite(0xFFFFFFFF). The valid range is 0 ~ 268435455 millliseconds. The negative value is also handled as infinite.
    optional TaskAttr task = 10; // If not specified, the task number is automatically assigned to be able to run as much as possible in parallel.
    optional ToolAttr tool = 11; // The default tool number is `0`.
    optional AccAttr acc = 12; // The acceleration of the motion. The default is `100` %. The min is `20` % and the max is `100` %.
    optional DecAttr dec = 13; // The deceleration of the motion. The default is `100` %. The min is `20` % and the max is `100` %.
    optional BlendingAttr blending = 14; // The default control is `BLENDING_DEFAULT` and the distance is as much as possible.
    optional RelativeAttr relative = 15; // If not specified, the target position is used as ABSOLUTE position.
    optional SynchronizationAttr synchronization = 16;
}

message SendLinearMotionTargetResponse {
    Timestamp timestamp = 1;

    SendTargetResult result = 2;

    SendTargetResponseStatus status = 3;
}

message MultiTargetsEntity {
    int32 group_no = 1;
    oneof targets {
        TargetPos target = 2; // Specify if the `interpolation` is JOINT or LINEAR.
        CircularTargetPos cir_target = 3; // Specify if the `interpolation` is CIRCULAR.
    }

    enum Interpolation {
        NOP = 0;    // NO Operation
        JOINT = 1;  // Joint interpolation
        LINEAR = 2; // Linear interpolation
        CIRCULAR = 3; // Not suported yet
    }
    Interpolation interpolation = 4;

    JointSpeedAttr joint_speed = 5; // Specify if the `interpolation` is JOINT. In linear or circular motion, this will be ignored.
    LinearSpeedAttr linear_speed = 6; // Specify if the `interpolation` is LINEAR or CIRCULAR. In joint motion, this will be ignored.

    optional TaskAttr task = 10; // If not specified, the task number is automatically assigned to be able to run as much as possible in parallel.
    optional ToolAttr tool = 11; // The default tool number is `0`.
    optional AccAttr acc = 12; // The acceleration of the motion. The default is `100` %. The min is `20` % and the max is `100` %.
    optional DecAttr dec = 13; // The deceleration of the motion. The default is `100` %. The min is `20` % and the max is `100` %.
    optional BlendingAttr blending = 14; // The default control is `BLENDING_DEFAULT` and the distance is as much as possible.
    optional RelativeAttr relative = 15; // If not specified, the target position is used as ABSOLUTE position.
    optional SynchronizationAttr synchronization = 16;
}

message MultiTargetsTimeline {
    repeated MultiTargetsEntity entities = 2;
}

//    R1    B1    R2    B2    <- group number
// [ MOVJ  MOVJ   NOP   NOP ] <- timeline
// [  NOP   NOP  MOVJ  MOVJ ]
// [ MOVL  MOVJ  MOVL  MOVJ ]
//    ^-----^-----^-----^------- entity
//
//  Each timelines must be composed of same a number of groups. It means the length of entities must be same across all timelines.

message SendMultipleMotionTargetsRequest {
    optional int32 timeout = 1;
    repeated MultiTargetsTimeline timelines = 2; // The targets list of each control groups 
}

message SendTargetResultTimeline {
    repeated SendTargetResult results = 1;
}

message SendMultipleMotionTargetsResponse {
    Timestamp timestamp = 1;

    repeated SendTargetResultTimeline result_timelines = 2;

    SendMultiTargetResponseStatus status = 3;
}

message ClearTargetRequest {
    uint32 control_group_bit = 1;
}

message ClearTargetResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
    }
    Status status = 2;
}

message ReceiveTargetRequest {
    uint32 group_no = 1;
    int32 target_id = 2;
    int32 timeout = 3;
}

message ReceiveTargetResponse {
    Timestamp timestamp = 1;

    enum ReceivedTargetStatus {
        RECEIVED_TARGET_STATUS_UNSPECIFIED = 0;
        RECEIVED_TARGET_STATUS_COMPLETE = 1; // The execution of target has been completed.
        RECEIVED_TARGET_STATUS_INTERRUPTED = 2; // The target have been interrupted.
    }
    ReceivedTargetStatus received_target_status = 2;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_GROUP_DOES_NOT_EXIST = 3; // Specified value in `group_no` does not exist.
        STATUS_TARGET_RECEIVE_TIMEOUT = 4; // Ended receiving target as timeout.
    }
    Status status = 3;
}

