    SEND_TARGET_RESPONSE_STATUS_TARGET_FIELD_ERROR = 6; // `target` field have wrong value.
    SEND_TARGET_RESPONSE_STATUS_SPEED_FILED_ERROR = 7; // `speed` field have wrong value.
