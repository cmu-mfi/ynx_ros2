    SEND_TARGET_RESPONSE_STATUS_SPEED_TYPE_OUTRANGE = 9; // Specified value in `speed` type is not supported.
    SEND_TARGET_RESPONSE_STATUS_FRAME_AUX_NO_MISSING = 10; // `frame_aux_no` is required for `user` target, but missing.
    SEND_TARGET_RESPONSE_STATUS_FRAME_AUX_NO_OUTRANGE = 11; // Specified value in `frame_aux_no` is out of range.
    SEND_TARGET_RESPONSE_STATUS_POS_TYPE_OUTRAGNE = 12; // Specified pos type in `TargetPos` is not supported.
    SEND_TARGET_RESPONSE_STATUS_TOOL_NO_OUTRANGE = 13; // Specified value in `tool.number` is out of range.
    SEND_TARGET_RESPONSE_STATUS_BLENDING_TYPE_OUTRANGE = 14; // Specified value in `blending.control` is not supported.
    SEND_TARGET_RESPONSE_STATUS_ACCELERATION_RATIO_OUTRANGE = 15; // Specified value in `acc.ratio` is out of range.
    SEND_TARGET_RESPONSE_STATUS_DECELERATION_RATIO_OUTRANGE = 16; // Specified value in `dec.ratio` is out of range.
    SEND_TARGET_RESPONSE_STATUS_REFERENCE_TYPE_OUTRANGE = 17; // Specified value in `reference.type` is not supported.
    SEND_TARGET_RESPONSE_STATUS_INTERPOLATION_TYPE_CONFLICT = 20; // Specified value in `interpolation_type` conflicts with other attributes.
    SEND_TARGET_RESPONSE_STATUS_SYNC_SLAVE_GROUP_TYPE_NOT_SUPPORTED = 21; // Specified group as a slave is unsupported group type for a slave group.
    SEND_TARGET_RESPONSE_STATUS_SYNC_MASTER_GROUP_TYPE_NOT_SUPPORTED = 22; // Specified group as a master is unsupported group type for a master group.
    SEND_TARGET_RESPONSE_STATUS_SYNC_MASTER_GROUP_NO_OUTRANGE = 23; // Specified master group number is illegal.
    SEND_TARGET_RESPONSE_STATUS_TASK_NO_OUTRANGE = 24; // Specified value in `task.number` is out of range.
    SEND_TARGET_RESPONSE_STATUS_BASE_TARGET_LACK = 25; // `targets` does not include a target for base group.
    SEND_TARGET_RESPONSE_STATUS_INTERPOLATION_TYPE_ILLEGAL = 26; // Specified `interpolation_type` is not supported for the group specified in `group_no`.
    SEND_TARGET_RESPONSE_STATUS_SYNC_SLAVE_GROUP_INTERPOLATION_TYPE_NOT_SUPPORTED = 27; // The `interpolation_type` for the slave group is not supported.
    SEND_TARGET_RESPONSE_STATUS_SYNC_MASTER_GROUP_INTERPOLATION_TYPE_NOT_SUPPORTED = 28; // The `interpolation_type` for the master group is not supported.
    SEND_TARGET_RESPONSE_STATUS_SYNC_GROUP_EXCEEDED = 29; // Exceeded number of coordinated motion group pair which must be one master and one slave group.
    SEND_TARGET_RESPONSE_STATUS_SPEED_VALUE_ILLEGAL = 33; // Invalid speed value is specified.
    SEND_TARGET_RESPONSE_STATUS_TASK_NO_MISSING = 34; // Task number is specified only for some targets. If set task number, task number must be set for all targets.
    SEND_TARGET_RESPONSE_STATUS_TIMEOUT = 35; // Target send request is not received until timeout.
    SEND_TARGET_RESPONSE_STATUS_POS_TYPE_NOT_SUPPORTED = 36; // Specified pos type is not supported.
    SEND_TARGET_RESPONSE_STATUS_SYNC_MASTER_GROUP_LACK = 37; // The master group's target is not included.
    SEND_TARGET_RESPONSE_STATUS_TIMEOUT_OUTRANGE = 38; // Specified `timeout`` is out of range.
    SEND_TARGET_RESPONSE_STATUS_BLENDING_TYPE_INTERPOLATION_ILLEGAL = 39; // Specified `BlendingControl` and interpolation type is not suported.
    SEND_TARGET_RESPONSE_STATUS_NOT_PLAY_MODE = 40; // Mode of robot controller is not play mode.
    SEND_TARGET_RESPONSE_STATUS_NOT_EQUAL_COORDINATES_OF_DST_AND_REF = 41; // Coordinates of distination and reference position are not equal for MOVC.
}

